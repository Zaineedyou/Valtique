## Valtique v5.4: mobile-first CRT/VHS post-processing.

size.buffer.colortex1=0.5 0.5
size.buffer.colortex2=0.25 0.25

screen = <profile> [PERFORMANCE] [SKY] [CRT_LOOK] [VHS_SIGNAL] [HALATION] [PHOSPHOR] [FIELD_CAMERA] [FILM_DAMAGE] [OUTLINE_CAT] [FOG_CAT]

screen.PERFORMANCE = POTATO_MODE
screen.SKY = ROUND_CELESTIAL_BODIES GODRAYS_ENABLED GODRAYS_STRENGTH
screen.CRT_LOOK = LETTERBOX_SIZE BARREL_DISTORTION CRT_DESATURATION CRT_CONTRAST GRAIN_STRENGTH DISTORT_STRENGTH CRT_STRENGTH SCANLINE_SPEED CONVERGENCE_STRENGTH
screen.VHS_SIGNAL = VHS_ENABLED VHS_JITTER VHS_NOISE VHS_TRACKING_RATE
screen.HALATION = HALATION_ENABLED HALATION_STRENGTH HALATION_RADIUS HALATION_THRESHOLD HALATION_WARMTH
screen.PHOSPHOR = PERSISTENCE_ENABLED PERSISTENCE_STRENGTH PERSISTENCE_DECAY PERSISTENCE_THRESHOLD
screen.FIELD_CAMERA = FIELD_CAMERA_ENABLED FIELD_EXPOSURE FIELD_MONO FIELD_COMPRESSION FIELD_SENSOR_NOISE FIELD_INTERLACE FIELD_OSD FIELD_OSD_OPACITY
screen.FILM_DAMAGE = SCRATCH_STRENGTH DUST_STRENGTH
screen.OUTLINE_CAT = OUTLINE_ENABLED OUTLINE_SCALED OUTLINE_THICKNESS OUTLINE_INTENSITY OUTLINE_GLOW
screen.FOG_CAT = FOG_ENABLED FOG_DENSITY BORDER_FOG_STRENGTH

sliders=GODRAYS_STRENGTH LETTERBOX_SIZE BARREL_DISTORTION CRT_DESATURATION CRT_CONTRAST GRAIN_STRENGTH DISTORT_STRENGTH CRT_STRENGTH SCANLINE_SPEED CONVERGENCE_STRENGTH VHS_JITTER VHS_NOISE VHS_TRACKING_RATE HALATION_STRENGTH HALATION_RADIUS HALATION_THRESHOLD HALATION_WARMTH PERSISTENCE_STRENGTH PERSISTENCE_DECAY PERSISTENCE_THRESHOLD FIELD_EXPOSURE FIELD_MONO FIELD_COMPRESSION FIELD_SENSOR_NOISE FIELD_INTERLACE FIELD_OSD_OPACITY OUTLINE_THICKNESS OUTLINE_INTENSITY OUTLINE_GLOW SCRATCH_STRENGTH DUST_STRENGTH FOG_DENSITY BORDER_FOG_STRENGTH

profile.FIELD_CAMERA_MODERN = FIELD_CAMERA_ENABLED FIELD_EXPOSURE=1.0 FIELD_MONO=0.70 FIELD_COMPRESSION=0.35 FIELD_SENSOR_NOISE=0.06 FIELD_INTERLACE=0.35 FIELD_OSD FIELD_OSD_OPACITY=0.75
profile.FIELD_CAMERA_ARCHIVE = FIELD_CAMERA_ENABLED FIELD_EXPOSURE=1.25 FIELD_MONO=0.85 FIELD_COMPRESSION=0.55 FIELD_SENSOR_NOISE=0.10 FIELD_INTERLACE=0.55 FIELD_OSD FIELD_OSD_OPACITY=1.0 !GODRAYS_ENABLED OUTLINE_ENABLED OUTLINE_SCALED OUTLINE_THICKNESS=4.0 OUTLINE_GLOW=1.5

# Terrain depth is used only to occlude global godrays; no world or player shadow is applied to final color.
shadow.enabled = true
shadowTerrain = true
shadowTranslucent = false
shadowEntities = false
shadowPlayer = false
shadowBlockEntities = false
