## Cinematic Old Film Shader (post-processing, 3 composite pass)
## Outline: default MATI (OUTLINE_ENABLED toggle). Diporting 1:1 dari
## Complementary Unbound (worldOutline.glsl), shader publik yang sudah
## tervalidasi luas, bukan reka logic sendiri.
## Fog: default MATI, aktifkan lewat FOG_ENABLED (toggle per gbuffers), atur
## kekuatannya lewat FOG_DENSITY.
## Bloom diproses di colortex1 beresolusi setengah layar (downsample) untuk
## performa lebih baik tanpa mengurangi kualitas visual secara signifikan.

size.buffer.colortex1=0.5 0.5

## Setting dikelompokkan per kategori: Film Look, Film Damage, Outline, Fog.
screen = [FILM_LOOK] [FILM_DAMAGE] [OUTLINE_CAT] [FOG_CAT]

screen.FILM_LOOK = LETTERBOX_SIZE SEPIA_STRENGTH GRAIN_STRENGTH DISTORT_STRENGTH CRT_STRENGTH BLOOM_STRENGTH
screen.FILM_DAMAGE = SCRATCH_STRENGTH DUST_STRENGTH
screen.OUTLINE_CAT = OUTLINE_ENABLED OUTLINE_SCALED OUTLINE_THICKNESS OUTLINE_INTENSITY
screen.FOG_CAT = FOG_ENABLED FOG_DENSITY BORDER_FOG_STRENGTH

sliders=LETTERBOX_SIZE GRAIN_STRENGTH DISTORT_STRENGTH BLOOM_STRENGTH SEPIA_STRENGTH OUTLINE_THICKNESS OUTLINE_INTENSITY SCRATCH_STRENGTH DUST_STRENGTH CRT_STRENGTH FOG_DENSITY BORDER_FOG_STRENGTH
